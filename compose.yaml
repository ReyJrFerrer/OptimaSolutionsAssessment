services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_PATH: /data/orders.sqlite
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:?Set HUBSPOT_ACCESS_TOKEN in .env}
      HUBSPOT_PIPELINE_ID: ${HUBSPOT_PIPELINE_ID:-default}
      HUBSPOT_DEAL_STAGE_ID: ${HUBSPOT_DEAL_STAGE_ID:-closedwon}
      HUBSPOT_PHP_CONFIRMED: ${HUBSPOT_PHP_CONFIRMED:-false}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      DASHBOARD_ADMIN_TOKEN: ${DASHBOARD_ADMIN_TOKEN:?Set DASHBOARD_ADMIN_TOKEN in .env}
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3001}:3001'
    volumes:
      - app-data:/data
    init: true
    restart: unless-stopped
    stop_grace_period: 10m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-5173}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 3
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.7
    profiles: [automation]
    user: '1000:1000'
    environment:
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_RUNNERS_ENABLED: 'true'
      N8N_RUNNERS_MODE: internal
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_HOST_PORT:-5678}
      WEBHOOK_URL: http://localhost:${N8N_HOST_PORT:-5678}/
      # Local HTTP only; published ports remain bound to loopback.
      N8N_SECURE_COOKIE: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      TZ: Asia/Manila
      GENERIC_TIMEZONE: Asia/Manila
    ports:
      - '127.0.0.1:${N8N_HOST_PORT:-5678}:5678'
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/workflows:ro
    init: true
    restart: unless-stopped
    stop_grace_period: 1m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5678/healthz/readiness',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
  exporter:
    image: python:3.13-slim
    profiles: [tools]
    working_dir: /work
    user: '${EXPORT_UID:-1000}:${EXPORT_GID:-1000}'
    environment:
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:?Set HUBSPOT_ACCESS_TOKEN in .env}
    volumes:
      - ./scripts/export_recent_deals.py:/work/scripts/export_recent_deals.py:ro
      - ./exports:/exports
    entrypoint: ['python', 'scripts/export_recent_deals.py']
    command: ['--output', '/exports/deals_last_7_days.csv']
volumes:
  app-data:
  n8n-data:
    name: ${N8N_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}_n8n-data}
    external: ${N8N_DATA_EXTERNAL:-false}
